<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Poison your Trace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="masthead">
      <h1><img src="icons/firesnake-32.png" alt="" />Poison your Trace</h1>
      <p class="intro">
        Websites try to recognise you and follow you around. This keeps each site in its own jar and
        hides part of your web identity, so you are harder to track.
      </p>
    </header>

    <!-- Hero master toggle: the one switch that arms or stands down every protection at once. -->
    <div class="control hero">
      <label for="enabled">Enabled</label>
      <span class="switch">
        <input id="enabled" type="checkbox" />
        <span id="status" class="status"></span>
      </span>
    </div>

    <!-- Merged per-site panel: a short live summary, then one row per protection. Each row is just the
         setting name with its tick box at the end; a "See how" disclosure (injected by popup.ts) sits on
         the line below with the plain-language explanation and the before→after visual. The old separate
         readout and "Details" disclosure are folded into this one panel. -->
    <section id="details" class="protections">

      <!-- Honest one-line state for the active tab (master off / paused / all-off / active). Filled by
           popup.ts's renderSummary; the element must exist or render() throws before the toggles bind. -->
      <p id="readout-summary" class="readout-summary"></p>

      <section class="zone">
        <h2>Applies to every site</h2>
        <div class="prot" data-key="rfp">
          <div class="prot-text">
            <label for="prot-rfp">Make your browser look ordinary</label>
            <p class="prot-note">Turn this off if a site stops working.</p>
          </div>
          <input id="prot-rfp" type="checkbox" class="prot-toggle" />
        </div>
        <div class="prot" data-key="webrtc">
          <div class="prot-text">
            <label for="prot-webrtc">Keep your IP address from leaking</label>
          </div>
          <input id="prot-webrtc" type="checkbox" class="prot-toggle" />
        </div>
        <div class="prot" data-key="trackingProtection">
          <div class="prot-text">
            <label for="prot-trackingProtection">Block known trackers</label>
          </div>
          <input id="prot-trackingProtection" type="checkbox" class="prot-toggle" />
        </div>
        <div class="prot" data-key="hyperlinkAuditing">
          <div class="prot-text">
            <label for="prot-hyperlinkAuditing">Stop silent click reports</label>
          </div>
          <input id="prot-hyperlinkAuditing" type="checkbox" class="prot-toggle" />
        </div>
        <div class="prot" data-key="networkPrediction">
          <div class="prot-text">
            <label for="prot-networkPrediction">Don't contact sites early</label>
          </div>
          <input id="prot-networkPrediction" type="checkbox" class="prot-toggle" />
        </div>
      </section>

      <section class="zone">
        <h2>Just this site</h2>
        <div class="prot" data-key="container">
          <div class="prot-text">
            <label for="prot-container">Keep this site in its own box</label>
          </div>
          <input id="prot-container" type="checkbox" class="prot-toggle" />
        </div>
      </section>
    </section>

    <footer class="popup-footer">
      <a href="about.html" target="_blank" rel="noopener">How it works &amp; what is hidden</a>
    </footer>
    <script src="dist/popup.js"></script>
  </body>
</html>
