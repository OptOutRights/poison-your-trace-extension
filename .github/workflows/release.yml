name: Release

# Builds and submits the extension to the Firefox Add-ons store (AMO, "listed" channel) when a
# version tag is pushed. Once Mozilla approves the version, every installed copy auto-updates from
# AMO — there is no self-hosted updates.json to maintain and no update_url in the manifest.
#
# Trigger: push a tag shaped like vX.Y.Z (for example v0.2.0). The tag version must match the
# "version" field in manifest.json; the job fails fast otherwise so the two never drift.
#
# What it does:
#   1. checkout, setup Node, npm ci, npm run build
#   2. web-ext sign --channel=listed, which uploads the version to addons.mozilla.org for review.
#      --approval-timeout=0 means CI submits and returns without waiting on Mozilla's async review.
#   3. build a source zip (AMO reviewers require source because the extension is bundled with
#      esbuild) and publish a minimal GitHub Release carrying only that zip, so the account owner
#      has a permanent link to hand to AMO when asked.
#
# Required repository secrets (Settings, Secrets and variables, Actions):
#   AMO_JWT_ISSUER  the JWT issuer from the addons.mozilla.org API credentials page
#   AMO_JWT_SECRET  the matching JWT secret
# Both must belong to the account that owns the listing for add-on id
# poison-your-trace-extension@optoutrights.org. Without them the signing step cannot run.
# See docs/store-migration.md for the one-time AMO setup.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Derive version and verify it matches the tag
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "Tag version ($tag_version) does not match manifest.json version ($manifest_version)." >&2
            echo "Bump the manifest version and retag so the two agree." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Build the source zip (for AMO review)
        run: |
          mkdir -p web-ext-artifacts
          git archive --worktree-attributes --format=zip \
            --prefix=poison-your-trace-source/ \
            -o "web-ext-artifacts/poison-your-trace-source-${{ steps.version.outputs.version }}.zip" \
            HEAD

      - name: Submit the extension to AMO (channel listed)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "Missing AMO_JWT_ISSUER or AMO_JWT_SECRET repository secrets; add them before releasing." >&2
            exit 1
          fi
          npx web-ext sign \
            --channel=listed \
            --approval-timeout=0 \
            --api-key="$AMO_JWT_ISSUER" \
            --api-secret="$AMO_JWT_SECRET"

      - name: Publish the GitHub Release (source only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            web-ext-artifacts/poison-your-trace-source-${{ steps.version.outputs.version }}.zip
